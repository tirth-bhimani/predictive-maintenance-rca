services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: predictive-maintenance-api
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: predictive-maintenance-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api